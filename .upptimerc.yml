# Upptime configuration for the My Ohana status page.
#
# This file is a copy for the record. The live one is `.upptimerc.yml` in
# the separate Bardinator/my-ohana-status repository, which runs the checks
# on GitHub every five minutes, completely apart from Vercel, so the page
# and the alerts keep working when the website is down. Setup steps:
# status/README.md.
#
# A check is "down" when it does not answer 200 (or the listed codes) within
# the time limit. Every check is a plain GET: nothing is written anywhere.

owner: Bardinator
repo: my-ohana-status

# Who GitHub notifies when a check goes down (an issue is opened, assigned
# to them, and closed again on recovery).
assignees:
  - Bardinator

sites:
  # Is the site up at all: Vercel, the domain and the home page.
  - name: Website
    url: https://www.myohana.co.uk
    maxResponseTime: 10000

  # Is everything behind it connected: the site's own health check reads
  # Sanity (content), works out where enquiries go (and that email can be
  # sent where they go by email), asks HighLevel for the enquiry pipeline,
  # and, once online booking is on, asks a House calendar for free slots.
  # It answers 503 when any of those fail.
  - name: Enquiries, CRM & content
    url: https://www.myohana.co.uk/api/health
    maxResponseTime: 20000

  # The one nursery template rendering from Sanity.
  - name: Nursery pages
    url: https://www.myohana.co.uk/nurseries
    maxResponseTime: 10000

  # Where the team edits the site.
  - name: Sanity Studio
    url: https://www.myohana.co.uk/studio
    maxResponseTime: 15000

  # Staging: uncomment once it has a fixed address that is not behind
  # Vercel's login (a protected preview answers 401, which says nothing).
  # - name: Staging
  #   url: https://myohana-staging.vercel.app
  #   maxResponseTime: 15000

status-website:
  # --- Address: keep exactly ONE of the two blocks below active. ---
  # In use: status.myohana.co.uk (Cloudflare record CNAME status ->
  # bardinator.github.io, DNS only; same domain under Settings -> Pages ->
  # Custom domain). No baseUrl with a custom domain: the page is served from
  # the root, and a baseUrl would send its scripts to a path that 404s.
  cname: status.myohana.co.uk

  name: My Ohana status
  logoUrl: https://www.myohana.co.uk/assets/brand/primary-logo.png
  hideNavTitle: true
  favicon: https://www.myohana.co.uk/icon.png
  introTitle: "Is everything working?"
  introMessage: >-
    Live checks of the My Ohana website every five minutes: the site itself,
    enquiries reaching our CRM, the content system and the nursery pages.
    If something here is red, families may not be able to enquire online, so
    please call the nursery directly.
  navbar:
    - title: Status
      href: https://status.myohana.co.uk/
    - title: Back to myohana.co.uk
      href: https://www.myohana.co.uk

  # Look and feel: the My Ohana site's own colours and fonts
  # (src/app/globals.css), on top of Upptime's light theme.
  theme: light
  links:
    - rel: preconnect
      href: https://fonts.googleapis.com
    - rel: stylesheet
      href: https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap
  css: >-
    :root{--body-background-color:#f8f3ee;--body-text-color:#303636;--card-background-color:#ffffff;--card-border-color:#e2dcd4;--nav-background-color:#ffffff;--nav-border-bottom-color:#e2dcd4;--nav-current-border-bottom-color:#f0936f;--up-border-left-color:#757931;--tag-up-background-color:#757931;--degraded-border-left-color:#b0632e;--tag-degraded-background-color:#b0632e;--change-background-color:#b0632e;--down-border-left-color:#a8321f;--down-background-color:#fbeae6;--tag-down-background-color:#a8321f;--tag-color:#ffffff;--error-button-border-color:#964f24;--error-button-background-color:#b0632e;--error-button-color:#ffffff;--submit-button-border-color:#964f24;--submit-button-background-color:#b0632e;--submit-button-color:#ffffff}
    body{font-family:Quicksand,system-ui,sans-serif;font-weight:500;line-height:1.6}
    h1,h2,h3,h4{font-family:"Baloo 2",Quicksand,system-ui,sans-serif;font-weight:600;color:#303636}
    h1{font-size:2.4rem;line-height:1.15} h2{font-size:1.6rem} h3{opacity:1;color:#5e625d}
    .container{max-width:880px;padding:0 1rem}
    nav{background:#ffffff;padding:.75rem 1rem;font-weight:600}
    nav .logo img{height:48px;width:auto}
    nav a{text-decoration:none;color:#303636}
    nav a:hover{color:#5f6228}
    [aria-current]{border-bottom:3px solid var(--nav-current-border-bottom-color)}
    article{border-radius:16px;border-left-width:6px !important;padding:1.1rem 1.4rem;box-shadow:0 1px 2px rgba(48,54,54,.06),0 4px 14px rgba(48,54,54,.05)}
    article + article{margin-top:.75rem}
    .tag{border-radius:999px;font-weight:700;letter-spacing:.02em;padding:.3rem .7rem}
    a{color:#5f6228} a:hover{color:#303636}
    footer{color:#5e625d;font-size:.9rem;text-align:center}


# Wording (replaces Upptime's own labels). Top level, not under status-website.
i18n:
  footer: "My Ohana · [myohana.co.uk](https://www.myohana.co.uk) · these checks run on GitHub, separately from the website"
  allSystemsOperational: "Everything is working"
  liveStatus: "Live status"
  activeIncidents: "Current problems"
  pastIncidents: "Past problems"
  degraded: "Slow"
